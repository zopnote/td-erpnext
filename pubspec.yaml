name: td_erpnext
executable: td-erpnext
description: Tool for automize backups and the management of the erpnext service under ubuntu.
version: 1.0.1
publish_to: none
entrypoint: main.dart

environment:
  sdk: ^3.10.6

dependencies:
  path: ^1.9.0
  natrix: ^0.1.3
  platform_attributes: ^0.1.0
  stepflow_systemd:
    git:
      ref: main
      url: https://github.com/zopnote/stepflow_systemd.git
  stepflow_docker:
    git:
      ref: main
      url: https://github.com/zopnote/stepflow_docker.git
  stepflow:
    git:
      url: https://github.com/zopnote/stepflow.git
      ref: main
  yaml: ^3.1.0